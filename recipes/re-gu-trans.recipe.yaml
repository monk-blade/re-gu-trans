# re-gu-trans recipe (plum-compatible)
# Usage:
#   ./scripts/install_recipe.sh
#
# Prerequisite: librime-qjs plugin on the frontend (see GUIDE.md / Release packages).
# Release packages ship binary Tries; this recipe lists build/install inputs and bins when present.

recipe:
  Rx: re-gu-trans
  description: >-
    Gujarati roman→script transliteration (Apple lexicon + attested dict rescoring)
    via librime-qjs. Does not install Squirrel/Weasel/Fcitx themselves.
  author: re-gu-trans
  version: '2.9'
  args:

install_files: >-
  rime/gujarati.schema.yaml
  rime/gujarati.custom.yaml.sample
  rime/js/gujarati_translator.js
  rime/js/engine.js
  rime/js/ranking.js
  rime/js/ranking_primitives.js
  rime/js/selection_tracker_processor.js
  rime/js/commit_on_punct_processor.js
  rime/js/ranking.js
  rime/js/phonetic.js
  rime/js/storage.js
  rime/js/learning.js
  rime/js/ranking_policy.json
  rime/js/native_lm_meta.json
  rime/js/emoji_keywords.json
  rime/js/exceptions.json
  rime/js/ltr_coefficients.json
  rime/js/lexicon.trie.bin
  rime/js/prefix.trie.bin
  rime/js/native_lm.trie.bin
