name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install marisa-trie (binary Tries)
        run: pip install marisa-trie
      - name: Leakage gate
        run: python3 scripts/check_lexicon_leakage.py
      - name: Smoke
        run: python3 eval/rank_offline.py
      - name: Apple integrity
        run: python3 eval/apple_integrity.py
      - name: Held-out (clean)
        run: python3 eval/held_out_agree.py
      - name: Gold
        run: python3 eval/gold_agree.py
      - name: Apple-class reference and large production suite
        run: |
          python3 eval/apple_class_reference.py
          node eval/neural_bridge_test.js
          node eval/ranking_primitives_test.js
          python3 eval/emoji_quality.py
          python3 eval/apple_class_benchmark.py --stress 10000
          python3 eval/menu_baseline_check.py
      - name: Budgets
        run: |
          python3 scripts/build_qjs_tries.py --bin --exceptions
          python3 eval/check_budgets.py
      - name: Clean deploy (file-level)
        run: |
          chmod +x scripts/package/clean_deploy_check.sh scripts/package/stage_payload.sh scripts/package/apply_qjs_writefile_atomic.sh
          ./scripts/package/clean_deploy_check.sh
      - name: Version sync
        run: python3 scripts/check_version_sync.py
      - name: Learning v2 contract
        run: |
          python3 eval/learning_v2_test.py
          node eval/learning_integration_runner.mjs
          node eval/storage_runtime_test.js
          node eval/runtime_capabilities_test.js
      - name: Binary/text payload parity
        run: python3 eval/binary_text_parity.py
      - name: Accepted generation-family ablations
        run: python3 eval/ablation_check.py
      - name: Coefficient schema validation
        run: python3 train/ltr/train_coefficients.py
      - name: Held-out diagnostic
        run: python3 eval/held_out_diag.py
      - name: Production benchmark
        run: python3 eval/bench_production.py
      - name: Release quality report
        run: python3 eval/release_quality_report.py

  integration-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew install boost
          pip3 install marisa-trie
      - name: Build patched QJS and binary assets
        run: |
          chmod +x scripts/package/*.sh scripts/package/macos/*.sh eval/rime_harness.sh
          python3 scripts/build_qjs_tries.py --bin --exceptions
          ./scripts/package/macos/build_librime_qjs.sh
          ./scripts/package/verify_qjs_plugin.sh dist/plugins/librime-qjs.dylib
      - name: Real librime menu and learning integration
        env:
          REQUIRE_RIME_DEPLOYER: '1'
          RIME_BUILD_ROOT: dist/librime-build-macos/librime
        run: ./eval/rime_harness.sh
