name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (without v). Empty = schema version-dev'
        required: false
        default: ''
      publish:
        description: 'Upload GitHub Release (tags always publish)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  LIBRIME_QJS_TAG: v1.3.0
  LIBRIME_TAG: '1.16.1'
  MODEL_PACK_ID: gu-transformer-ctc-v3
  REQUIRE_BINARY_TRIES: '1'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  stage:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            # shellcheck source=/dev/null
            source scripts/package/common.sh
            V="$(resolve_version)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V"
      - name: Verify runtime assets
        run: |
          pip install marisa-trie
          export REQUIRE_BINARY_TRIES=1
          python3 scripts/build_qjs_tries.py --bin --exceptions
          test -f rime/js/gujarati_translator.js
          test -f rime/js/commit_on_punct_processor.js
          test -f rime/js/ranking_policy.json
          test -f rime/js/lexicon.trie.bin
          test -f rime/js/prefix.trie.bin
          test -f rime/js/native_lm.trie.bin
          test -f rime/js/native_lm_meta.json
          test -f rime/gujarati.schema.yaml
          ! grep -E '^\s*dictionary:\s*gujarati' rime/gujarati.schema.yaml
          python3 scripts/check_lexicon_leakage.py
          python3 scripts/check_version_sync.py
      - name: Clean deploy check
        run: |
          chmod +x scripts/package/*.sh
          export REQUIRE_BINARY_TRIES=1
          ./scripts/package/clean_deploy_check.sh
      - name: Smoke + quality report
        run: |
          pip install onnxruntime numpy
          python3 eval/rank_offline.py
          python3 eval/apple_integrity.py
          python3 eval/apple_class_reference.py
          node eval/neural_bridge_test.js
          python3 eval/emoji_quality.py
          python3 eval/apple_class_benchmark.py --stress 250000 --require-full
          python3 eval/neural_model_benchmark.py
          REQUIRE_HYBRID=1 python3 eval/release_quality_report.py

  linux:
    needs: stage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunwind-dev ninja-build
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl zip unzip \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-locale-dev libboost-regex-dev \
            libgoogle-glog-dev libgtest-dev libyaml-cpp-dev \
            libleveldb-dev libmarisa-dev libopencc-dev \
            libcapnp-dev capnproto \
            p7zip-full rpm python3-pip
          python -m pip install marisa-trie
      - name: Install nfpm
        run: |
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build binaries + packages
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_BINARY_TRIES: '1'
        run: |
          chmod +x scripts/package/linux/*.sh scripts/package/*.sh
          chmod +x packaging/linux/re-gu-trans-enable packaging/linux/postinst.sh
          python3 scripts/build_qjs_tries.py --bin --exceptions
          ./scripts/package/linux/build_packages.sh
          curl -fsSL -o "$RUNNER_TEMP/ort.tgz" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          ONNXRUNTIME_ROOT="$RUNNER_TEMP/onnxruntime-linux-x64-1.23.2" \
            ./scripts/package/linux/build_neural_model_pack.sh
          python3 eval/native_model_plugin_test.py dist/gujarati-model-pack-linux
          (cd dist/gujarati-model-pack-linux && zip -qr \
            ../packages/re-gu-trans-${MODEL_PACK_ID}-linux-x64.zip .)
          ./scripts/package/validate_payload.sh dist/payload-linux
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.so \
            ./eval/rime_harness.sh
          EXPECT_NEURAL_REQUIRED_MISSING=1 \
            REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.so \
            ./eval/rime_harness.sh
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.so \
            NEURAL_MODEL_PACK=dist/gujarati-model-pack-linux \
            ./eval/rime_harness.sh
          python3 eval/platform_verification.py \
            --platform linux --arch x86_64 \
            --plugin dist/plugins/librime-qjs.so --payload dist/payload-linux \
            --package "$(find dist/packages -name '*.deb' | head -1)" \
            --package "$(find dist/packages -name '*.rpm' | head -1)" \
            --model-pack dist/packages/re-gu-trans-${MODEL_PACK_ID}-linux-x64.zip \
            --output dist/reports/verification-linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/*gu-transformer-ctc-v3-linux-x64.zip
            dist/reports/verification-linux.json

  macos:
    needs: stage
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew install boost
          python -m pip install marisa-trie
      - name: Build pkg + zip
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_BINARY_TRIES: '1'
        run: |
          chmod +x scripts/package/macos/*.sh scripts/package/*.sh
          chmod +x scripts/package/macos/postinstall
          python3 scripts/build_qjs_tries.py --bin --exceptions
          ./scripts/package/macos/build_pkg.sh
          curl -fsSL -o "$RUNNER_TEMP/ort.tgz" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-arm64-1.23.2.tgz
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          ONNXRUNTIME_ROOT="$RUNNER_TEMP/onnxruntime-osx-arm64-1.23.2" \
            ./scripts/package/macos/build_neural_model_pack.sh
          python3 eval/native_model_plugin_test.py dist/gujarati-model-pack-macos
          (cd dist/gujarati-model-pack-macos && zip -qr \
            ../packages/re-gu-trans-${MODEL_PACK_ID}-macos-arm64.zip .)
          ./scripts/package/validate_payload.sh dist/payload-macos
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-macos/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.dylib \
            ./eval/rime_harness.sh
          EXPECT_NEURAL_REQUIRED_MISSING=1 \
            REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-macos/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.dylib \
            ./eval/rime_harness.sh
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-macos/librime \
            RIME_PLUGIN=dist/plugins/librime-qjs.dylib \
            NEURAL_MODEL_PACK=dist/gujarati-model-pack-macos \
            ./eval/rime_harness.sh
          python3 eval/platform_verification.py \
            --platform macos --arch arm64 \
            --plugin dist/plugins/librime-qjs.dylib --payload dist/payload-macos \
            --package "dist/packages/re-gu-trans-${VERSION}-macos-arm64.zip" \
            --package "dist/packages/re-gu-trans-${VERSION}-macos-arm64.pkg" \
            --model-pack dist/packages/re-gu-trans-${MODEL_PACK_ID}-macos-arm64.zip \
            --output dist/reports/verification-macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            dist/packages/*macos-arm64.pkg
            dist/packages/*macos-arm64.zip
            dist/packages/*gu-transformer-ctc-v3-macos-arm64.zip
            dist/reports/verification-macos.json

  windows:
    needs: stage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install 7zip + marisa-trie
        shell: bash
        run: |
          choco install 7zip aria2 -y --no-progress
          echo "$PROGRAMFILES/7-Zip" >> "$GITHUB_PATH"
          echo "/c/Program Files/7-Zip" >> "$GITHUB_PATH"
          python -m pip install marisa-trie
      - name: Build zip
        shell: bash
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_BINARY_TRIES: '1'
        run: |
          chmod +x scripts/package/windows/*.sh scripts/package/*.sh
          export PATH="/c/Program Files/7-Zip:$PATH"
          python scripts/build_qjs_tries.py --bin --exceptions
          ./scripts/package/windows/build_zip.sh
          curl -fsSL -o "$RUNNER_TEMP/ort.zip" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-win-x64-1.23.2.zip
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/ort.zip" >/dev/null
          ONNXRUNTIME_ROOT="$RUNNER_TEMP/onnxruntime-win-x64-1.23.2" \
            ./scripts/package/windows/build_neural_model_pack.sh
          python eval/native_model_plugin_test.py dist/gujarati-model-pack-windows
          (cd dist/gujarati-model-pack-windows && 7z a -tzip -y \
            ../packages/re-gu-trans-${MODEL_PACK_ID}-windows-x64.zip . >/dev/null)
          ./scripts/package/validate_payload.sh dist/payload-windows
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-windows/librime \
            RIME_PLUGIN=dist/plugins/rime.dll \
            ./eval/rime_harness.sh
          EXPECT_NEURAL_REQUIRED_MISSING=1 \
            REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-windows/librime \
            RIME_PLUGIN=dist/plugins/rime.dll \
            ./eval/rime_harness.sh
          REQUIRE_RIME_DEPLOYER=1 \
            RIME_BUILD_ROOT=dist/librime-build-windows/librime \
            RIME_PLUGIN=dist/plugins/rime.dll \
            NEURAL_MODEL_PACK=dist/gujarati-model-pack-windows \
            ./eval/rime_harness.sh
          python eval/platform_verification.py \
            --platform windows --arch x86_64 \
            --plugin dist/plugins/rime.dll --payload dist/payload-windows \
            --package "dist/packages/re-gu-trans-${VERSION}-windows-x64.zip" \
            --model-pack dist/packages/re-gu-trans-${MODEL_PACK_ID}-windows-x64.zip \
            --output dist/reports/verification-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            dist/packages/*windows-x64.zip
            dist/packages/*gu-transformer-ctc-v3-windows-x64.zip
            dist/reports/verification-windows.json

  release-gate:
    needs: [stage, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate observed platform verification
        run: |
          python3 eval/aggregate_platform_reports.py artifacts \
            --output dist/reports/release-platform-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-platform-report
          path: dist/reports/release-platform-report.json

  publish:
    needs: [stage, release-gate]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || inputs.publish == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg' -o -name '*.zip' \) \
            -exec cp -f {} release-assets/ \;
          ls -la release-assets
          echo "count=$(find release-assets -type f | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        env:
          VERSION: ${{ needs.stage.outputs.version }}
          QJS_TAG: ${{ env.LIBRIME_QJS_TAG }}
          RIME_TAG: ${{ env.LIBRIME_TAG }}
        run: |
          cat > release-notes.md <<EOF
          ## Akshar GU (re-gu-trans) ${VERSION}

          Plugin + schema packages (requires a Rime frontend on each OS).
          Pinned **librime-qjs ${QJS_TAG}** / librime **${RIME_TAG}**.
          Binary Tries only (no multi-MB JSON/TSV fallback in release payloads).

          ### Assets

          | Platform | File | Frontend |
          |----------|------|----------|
          | macOS arm64 | \`re-gu-trans-${VERSION}-macos-arm64.pkg\` / \`.zip\` | [Squirrel](https://github.com/rime/squirrel/releases) |
          | Windows x64 | \`re-gu-trans-${VERSION}-windows-x64.zip\` | [Weasel](https://github.com/rime/weasel/releases) |
          | Linux amd64 | \`re-gu-trans_${VERSION}_amd64.deb\` / \`.rpm\` | fcitx5-rime or ibus-rime |

          Optional offline Gujarati model packs are published as
          \`re-gu-trans-gu-transformer-ctc-v3-<platform>.zip\`. The deterministic core remains fully usable
          without a model pack; \`neural_mode: required\` intentionally blocks menus if its pack is absent.

          Full guide: [GUIDE.md](https://github.com/monk-blade/re-gu-trans/blob/main/GUIDE.md) · Typing: [USAGE.md](https://github.com/monk-blade/re-gu-trans/blob/main/USAGE.md)
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.stage.outputs.version) }}
          name: re-gu-trans ${{ needs.stage.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.stage.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
