# nfpm config — version placeholder __VERSION__ replaced at build time
name: re-gu-trans
arch: amd64
platform: linux
version: __VERSION__
section: utils
priority: optional
maintainer: re-gu-trans <noreply@users.noreply.github.com>
description: |
  Gujarati roman→script transliteration for Rime (lexicon + QuickJS), with the
  IndicXlit neural model, fcitx5, and the Ori theme + Noto Serif Gujarati
  candidate font all installed as part of this package. On a system with a
  desktop session, installing this package enables Gujarati typing directly;
  otherwise run re-gu-trans-enable once as your user.
vendor: re-gu-trans
homepage: https://github.com/monk-blade/re-gu-trans
license: MIT
contents:
  - src: dist/linux-root/usr/lib/rime-plugins/librime-qjs.so
    dst: /usr/lib/rime-plugins/librime-qjs.so
    file_info:
      mode: 0755
  - src: dist/linux-root/usr/lib/x86_64-linux-gnu/rime-plugins/librime-qjs.so
    dst: /usr/lib/x86_64-linux-gnu/rime-plugins/librime-qjs.so
    file_info:
      mode: 0755
  - src: dist/linux-root/usr/share/rime-data/
    dst: /usr/share/rime-data/
    type: tree
  - src: dist/linux-root/usr/share/re-gu-trans/
    dst: /usr/share/re-gu-trans/
    type: tree
  - src: dist/linux-root/usr/bin/re-gu-trans-enable
    dst: /usr/bin/re-gu-trans-enable
    file_info:
      mode: 0755
  - src: dist/linux-root/usr/share/fcitx5/themes/
    dst: /usr/share/fcitx5/themes/
    type: tree
  - src: dist/linux-root/etc/xdg/fcitx5/conf/classicui.conf
    dst: /etc/xdg/fcitx5/conf/classicui.conf
    type: config|noreplace
scripts:
  postinstall: packaging/linux/postinst.sh
overrides:
  deb:
    depends:
      - librime1 | librime
      - fcitx5
      - fcitx5-rime
      - fonts-noto-core
  rpm:
    depends:
      - librime
      - fcitx5
      - fcitx5-rime
      - google-noto-serif-gujarati-vf-fonts
