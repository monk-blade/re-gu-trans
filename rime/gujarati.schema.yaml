# Rime schema for Gujarati Transliteration (JS via librime-qjs)
# encoding: utf-8
# Runtime is qjs-only — no table_translator / Rime .dict.yaml dependency.

schema:
  schema_id: gujarati
  name: Gujarati Transliteration
  version: '2.9'
  author:
    - OpenCode
    - re-gu-trans
  description: |
    Gujarati transliteration with Apple lexicon + attested dictionary
    rescoring via librime-qjs. Space and punctuation commit the selection.

engine:
  processors:
    - ascii_composer
    - recognizer
    # BEFORE key_binder: unmodified Space/punct commit (learning via translator notifiers)
    - qjs_processor@commit_on_punct_processor
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - qjs_translator@gujarati_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+"
  delimiter: " '"
  max_code_length: 0

menu:
  page_size: 6

translator:
  # qjs knobs (no Rime table dictionary)
  enable_user_learning: true
  user_learning_threshold: 2
  # Prefer attested lexicon; drop unknown phonetic inventions when exact hits exist
  lexicon_hard_gate: true
  # When only fuzzy/near-exact lexicon hits exist (low weight), still allow
  # high-validity / spell-dict phonetics into the menu.
  fuzzy_exact_soft: true
  include_latin: true
  # Hard cap returned candidates (page_size alone still pages extras).
  max_candidates: 6
  max_prefix: 3
  max_phonetic: 4
  # Keyword emoji suggestions (English + Gujarati-roman); always below script
  emoji_enable: true
  max_emoji: 2
  lm_unigram_weight: 0.6
  lm_user_weight: 0.6

switches:
  - name: ascii_mode
    reset: 0
    states: [ ગુજરાતી, ASCII ]

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # Undo default paging on . / , so commit_on_punct can commit the candidate
    - { accept: period, send: period, when: has_menu }
    - { accept: comma, send: comma, when: has_menu }
    - { accept: period, send: period, when: paging }
    - { accept: comma, send: comma, when: paging }

recognizer:
  import_preset: default
